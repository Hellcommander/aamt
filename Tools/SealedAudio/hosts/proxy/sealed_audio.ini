; sealed_audio.ini for the version.dll proxy host. Put version.dll and this file beside the game's executable.
[SealedAudio]
; The folder the game reads loose files from, relative to the executable or absolute.
DataDir=Data
; The path segment that marks that folder in the paths the engine builds (usually the folder's own name).
DataFolderName=Data
; Where the *.mtsa archives live. Empty: <DataDir>\SealedAudio
ArchiveDir=
; Empty: <executable folder>\SealedAudio.log
LogFile=
; 0: hook the executable only. 1: also script-extender dlls and plugins under DataDir. 2: every module in the game folder.
PatchModules=1
ModulePrefixes=skse;sfse;f4se;nvse;obse
; Wait this long before hooking (for games that unpack or relaunch themselves first).
StartDelayMs=0
; Diagnostics, all off for play.
SelfTest=0
LogProbes=0
LogImports=0
CrashLog=0
