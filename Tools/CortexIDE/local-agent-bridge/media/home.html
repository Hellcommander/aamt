<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>New Tab</title>
<style>
  :root{--muted:var(--vscode-descriptionForeground,#8b8b8b);--line:var(--vscode-widget-border,var(--vscode-panel-border,rgba(128,128,128,.28)));--hover:var(--vscode-list-hoverBackground,rgba(128,128,128,.14));--accent:var(--vscode-focusBorder,#3b82f6)}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--vscode-editor-background,#181818);color:var(--vscode-foreground,#ccc);font-family:var(--vscode-font-family,system-ui,sans-serif);font-size:13px}
  button,textarea,select{font:inherit;color:inherit}
  button{cursor:pointer}
  main{max-width:600px;margin:0 auto;padding:12vh 24px 48px}
  @media (max-height:600px){main{padding-top:32px}}

  /* composer */
  .box{border:1px solid var(--line);border-radius:10px;background:var(--vscode-input-background,#1f1f1f);padding:10px 10px 8px;transition:border-color .12s}
  .box:focus-within{border-color:var(--accent)}
  #q{display:block;width:100%;min-height:52px;max-height:40vh;resize:none;border:0;outline:0;background:transparent;line-height:1.5;padding:2px 4px}
  #q::placeholder{color:var(--muted)}
  .bar{display:flex;align-items:center;gap:6px;margin-top:6px}
  .chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:12px;border:1px solid transparent;background:var(--vscode-badge-background,rgba(128,128,128,.18));color:var(--vscode-badge-foreground,inherit);font-size:12px}
  .chip:hover{border-color:var(--line)}
  .chip svg{width:12px;height:12px}
  .ghost{background:transparent;color:var(--muted)}
  .ghost:hover{color:var(--vscode-foreground)}
  .grow{flex:1}
  #send{width:26px;height:26px;border-radius:50%;border:0;display:inline-flex;align-items:center;justify-content:center;background:var(--vscode-button-background,#0e70c0);color:var(--vscode-button-foreground,#fff)}
  #send:disabled{opacity:.35;cursor:default}
  #send svg{width:14px;height:14px}
  .hint{margin:8px 4px 0;font-size:11px;color:var(--muted)}
  #modes{position:absolute;z-index:5;min-width:220px;border:1px solid var(--line);border-radius:8px;background:var(--vscode-menu-background,var(--vscode-editorWidget-background,#252526));box-shadow:0 6px 24px rgba(0,0,0,.35);padding:4px;display:none}
  #modes.on{display:block}
  #modes button{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:5px;padding:6px 8px}
  #modes button:hover,#modes button:focus{background:var(--hover);outline:0}
  #modes small{display:block;color:var(--muted);font-size:11px;margin-top:1px}

  /* lists */
  .sec{margin:26px 0 4px;padding:0 6px;font-size:12px;color:var(--muted);display:flex;align-items:center}
  .sec .grow{flex:1}
  .sec button{border:0;background:transparent;color:var(--muted);font-size:11px;padding:0}
  .sec button:hover{color:var(--vscode-textLink-foreground,#3794ff)}
  .row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;border-radius:6px;padding:5px 6px;min-height:28px}
  .row:hover,.row:focus{background:var(--hover);outline:0}
  .row svg{flex:none;width:16px;height:16px;color:var(--muted)}
  .row .l{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .d{flex:none;font-size:11px;color:var(--muted);max-width:45%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--vscode-progressBar-background,#0e70c0);animation:p 1s ease-in-out infinite}
  @keyframes p{50%{opacity:.3}}
  .grid{display:flex;flex-direction:column;gap:1px}
  .empty{padding:4px 6px;color:var(--muted);font-size:12px}
  footer{margin-top:36px;padding:0 6px;font-size:11px;color:var(--muted);line-height:1.6}
  kbd{font-family:var(--vscode-editor-font-family,monospace);font-size:10px;border:1px solid var(--line);border-radius:3px;padding:0 4px}
</style>
</head>
<body>
<main>
  <div class="box">
    <textarea id="q" rows="2" placeholder="Plan, search, build anything" aria-label="Message for a new agent chat"></textarea>
    <div class="bar">
      <button class="chip" id="mode" type="button" aria-haspopup="true" title="Mode for this chat"></button>
      <button class="chip ghost" id="model" type="button" title="Change backend and model"></button>
      <span class="grow"></span>
      <button id="send" type="button" title="Start a chat (Enter)" disabled></button>
    </div>
  </div>
  <div id="modes" role="menu"></div>
  <p class="hint">Starts a new chat in the Agent panel. <kbd>Enter</kbd> sends, <kbd>Shift</kbd>+<kbd>Enter</kbd> new line, <kbd>/</kbd> for commands, <kbd>@agent</kbd> to pick an agent.</p>
  <div id="lists"></div>
  <footer id="foot"></footer>
</main>
<script>/*@composer*/</script>
<script>
const vs = typeof acquireVsCodeApi === "function" ? acquireVsCodeApi() : { postMessage(){}, getState(){}, setState(){} };
const $ = (id) => document.getElementById(id);
const ICON = {
  globe: '<path d="M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13Zm0 0c1.8 1.8 2.7 4 2.7 6.5S9.8 12.7 8 14.5M8 1.5C6.2 3.3 5.3 5.5 5.3 8s.9 4.7 2.7 6.5M1.7 6h12.6M1.7 10h12.6"/>',
  diff: '<path d="M8 2.5v6M5 5.5h6M5 12.5h6"/>',
  term: '<rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><path d="m4.5 6 2 2-2 2M8 10.5h3.5"/>',
  file: '<path d="M4 1.5h5l3.5 3.5v9.5H4z"/><path d="M9 1.5V5h3.5"/>',
  brush: '<path d="M13.5 2.5 7 9l-1-1 6.5-6.5zM6 8l2 2c-.4 2-2.4 3.5-5 3.5.8-1 .6-2.2.9-3.1C4.3 9.3 5 8.5 6 8Z"/>',
  chat: '<path d="M2.5 3.5h11v7.5H7l-3 2.5V11H2.5z"/>',
  doc: '<path d="M4 1.5h5l3.5 3.5v9.5H4z"/><path d="M6 8.5h4M6 11h4"/>',
  star: '<path d="m8 2 1.8 3.8 4.2.5-3.1 2.9.8 4.1L8 11.3l-3.7 2 .8-4.1L2 6.3l4.2-.5z"/>',
  plus: '<path d="M8 3v10M3 8h10"/>',
  hist: '<path d="M2.5 8a5.5 5.5 0 1 0 1.6-3.9M2.5 2.5v2.5H5M8 5v3.2l2 1.3"/>',
  agent: '<path d="M8 1.5 9.6 6.4 14.5 8 9.6 9.6 8 14.5 6.4 9.6 1.5 8l4.9-1.6z"/>',
  up: '<path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/>',
  chev: '<path d="m4 6 4 4 4-4"/>',
};
const svg = (n) => '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICON[n] || ICON.doc) + "</svg>";
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

let data = { tabs: [], canvases: [], custom: [], recent: [], ws: "", changes: 0, backend: "" };
const saved = vs.getState() || {};
let mode = saved.mode && Composer.MODES[saved.mode] ? saved.mode : "agent";
$("q").value = saved.draft || "";

function paintMode(){
  $("mode").innerHTML = svg("agent") + "<span></span>" + svg("chev");
  $("mode").querySelector("span").textContent = Composer.MODES[mode].label;
}
function paintModel(){
  $("model").textContent = data.backend || "Choose model";
}
function keep(){ vs.setState({ mode, draft: $("q").value }); }
function typed(){
  const q = $("q");
  q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, innerHeight * 0.4) + "px";
  $("send").disabled = !q.value.trim();
  keep();
}
function send(){
  const t = $("q").value.trim(); if (!t) return;
  vs.postMessage({ type: "send", text: t, mode });
  $("q").value = ""; typed();
}

/* modes menu */
function openModes(on){
  const m = $("modes");
  if (!on){ m.classList.remove("on"); return; }
  m.innerHTML = "";
  for (const [id, x] of Object.entries(Composer.MODES)){
    const b = el("button"); b.type = "button"; b.setAttribute("role", "menuitem");
    b.appendChild(el("span", "", x.label + (id === mode ? "  ✓" : ""))); b.appendChild(el("small", "", x.hint));
    b.onclick = () => { mode = id; paintMode(); keep(); openModes(false); $("q").focus(); };
    m.appendChild(b);
  }
  const r = $("mode").getBoundingClientRect();
  m.style.left = r.left + scrollX + "px"; m.style.top = r.bottom + scrollY + 6 + "px";
  m.classList.add("on");
  m.querySelector("button").focus();
}

/* lists */
function row(parent, icon, label, detail, onClick, title){
  const b = el("button", "row"); b.type = "button";
  b.innerHTML = svg(icon);
  b.appendChild(el("span", "l", label));
  if (detail === "●") b.appendChild(el("span", "dot"));
  else if (detail) b.appendChild(el("span", "d", detail));
  b.title = title || label;
  b.onclick = onClick;
  parent.appendChild(b);
  return b;
}
function section(title, action){
  const s = el("div", "sec"); s.appendChild(el("span", "", title)); s.appendChild(el("span", "grow"));
  if (action){ const b = el("button", "", action.label); b.type = "button"; b.onclick = action.run; s.appendChild(b); }
  $("lists").appendChild(s);
  const box = el("div", "grid"); $("lists").appendChild(box);
  return box;
}
const panel = (msg) => () => vs.postMessage(Object.assign({ type: "panel" }, msg));
function ago(t){
  if (!t) return "";
  const s = (Date.now() - t) / 1000;
  if (s < 60) return "now"; if (s < 3600) return Math.floor(s / 60) + "m"; if (s < 86400) return Math.floor(s / 3600) + "h";
  return Math.floor(s / 86400) + "d";
}
function paint(){
  paintModel();
  const L = $("lists"); L.innerHTML = "";
  if (data.tabs.length){
    const g = section("Open Tabs");
    for (const t of data.tabs.slice(0, 10)) row(g, /^https?:/.test(t.uri) ? "globe" : "file", t.label, t.dirty ? "unsaved" : "", panel({ id: "tab", uri: t.uri }), t.path || t.uri);
    if (data.tabs.length > 10) g.appendChild(el("div", "empty", "+" + (data.tabs.length - 10) + " more"));
  }
  const w = section("On " + (data.ws || "this workspace"));
  row(w, "diff", "Changes", data.changes ? String(data.changes) : "", panel({ id: "changes" }), "Uncommitted changes in source control");
  row(w, "globe", "Browser", "", panel({ id: "browser" }), "Open a page (e.g. your dev server) beside the editor");
  row(w, "term", "Terminal", "", panel({ id: "terminal" }), "Show the terminal");
  row(w, "file", "Files", "", panel({ id: "files" }), "Show the Explorer");
  row(w, "brush", "Canvas", data.canvases.length ? String(data.canvases.length) : "new", panel({ id: "canvas" }), data.canvases.length ? "Open a canvas" : "Ask the agent to make a canvas");
  row(w, "chat", "Side Chat", "", panel({ id: "side" }), "A new chat in the Agent panel (running chats keep going)");

  const c = section("Canvases", { label: "New canvas", run: () => vs.postMessage({ type: "newCanvas" }) });
  if (data.canvases.length) for (const x of data.canvases.slice(0, 12)) row(c, "brush", x.name, "", panel({ id: "openCanvas", file: x.file }), x.file);
  else c.appendChild(el("div", "empty", "No canvases in this workspace yet. A canvas is a live React page (.canvas.tsx) the agent can build: dashboards, reports, tools."));
  if (data.otherCanvases) row(c, "plus", "Link canvases from other workspaces", String(data.otherCanvases), () => vs.postMessage({ type: "linkCanvas" }), "Show canvases of another workspace (for example a project that moved drives) in this one too");

  if (data.custom.length){
    const p = section("Panels");
    for (const x of data.custom) row(p, "star", x.label, x.hint, panel({ id: "custom", index: x.index }), x.label);
  }

  const r = section("Recent Chats", { label: "View all", run: () => vs.postMessage({ type: "history" }) });
  if (data.recent.length) for (const x of data.recent) row(r, "chat", x.title, x.status === "running" ? "●" : [x.model, ago(x.updated)].filter(Boolean).join(" · "), () => vs.postMessage({ type: "chat", id: x.id }), x.title + (x.model ? "\n" + x.model : ""));
  else r.appendChild(el("div", "empty", "No chats yet."));

  $("foot").textContent = "Add your own entries with the localAgentBridge.agent.panels setting. Turn this page off with localAgentBridge.newTab.";
}

$("q").addEventListener("input", typed);
$("q").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); }
});
$("send").innerHTML = svg("up");
$("send").onclick = send;
$("mode").onclick = (e) => { e.stopPropagation(); openModes(!$("modes").classList.contains("on")); };
$("model").onclick = () => vs.postMessage({ type: "model" });
document.addEventListener("click", (e) => { if (!$("modes").contains(e.target)) openModes(false); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") openModes(false); });
window.addEventListener("message", (ev) => {
  const m = ev.data || {};
  if (m.type === "data"){ data = Object.assign({ tabs: [], canvases: [], custom: [], recent: [] }, m); paint(); }
});
paintMode(); typed(); paint();
$("q").focus();
vs.postMessage({ type: "ready" });
</script>
</body>
</html>
