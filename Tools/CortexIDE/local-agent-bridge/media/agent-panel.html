<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';"/>
<title>Agent</title>
<style>
  :root{--gap:8px;--radius:6px;--muted:var(--vscode-descriptionForeground);--line:var(--vscode-panel-border,rgba(128,128,128,.35));--accent:var(--vscode-focusBorder);--link:var(--vscode-textLink-foreground)}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;padding:0;background:var(--vscode-sideBar-background);color:var(--vscode-foreground);font-family:var(--vscode-font-family);font-size:var(--vscode-font-size)}
  button{font:inherit;color:inherit;cursor:pointer}
  #wrap{display:flex;flex-direction:column;height:100%;position:relative}

  /* ---- top bar ---- */
  #top{display:flex;align-items:center;gap:6px;padding:8px 10px 6px;border-bottom:1px solid var(--line)}
  #backend{flex:1;min-width:0;display:flex;align-items:center;gap:8px;text-align:left;background:var(--vscode-input-background);border:1px solid var(--vscode-input-border,var(--line));border-radius:var(--radius);padding:5px 8px}
  #backend:hover{border-color:var(--accent)}
  #dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--muted)}
  #dot.ok{background:var(--vscode-testing-iconPassed,#3fb950)}
  #dot.bad{background:var(--vscode-errorForeground,#f85149)}
  #dot.busy{background:var(--vscode-progressBar-background,#0e70c0);animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
  #bk{min-width:0;flex:1;display:flex;flex-direction:column;line-height:1.25}
  #bkname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #bkdetail{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #backend .chev{flex:none;color:var(--muted)}
  .icon{flex:none;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:1px solid transparent;border-radius:var(--radius);font-size:15px;line-height:1}
  .icon:hover,.icon[aria-expanded="true"]{background:var(--vscode-toolbar-hoverBackground,rgba(128,128,128,.2))}

  /* ---- chat tabs (open chats; each runs on its own model) ---- */
  #tabs{display:flex;gap:4px;padding:5px 10px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
  #tabs:empty{display:none}
  .tab{flex:none;display:flex;align-items:center;gap:5px;max-width:170px;font-size:11px;background:transparent;border:1px solid var(--line);border-radius:12px;padding:2px 4px 2px 8px;color:var(--muted)}
  .tab:hover{color:var(--vscode-foreground);border-color:var(--accent)}
  .tab.on{color:var(--vscode-foreground);background:var(--vscode-input-background);border-color:var(--accent)}
  .tab .tt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tab.unread .tt,.hrow.unread .ht{font-weight:700}
  .tab .x{flex:none;width:16px;height:16px;line-height:15px;text-align:center;border-radius:50%;opacity:.6}
  .tab .x:hover{opacity:1;background:var(--vscode-toolbar-hoverBackground,rgba(128,128,128,.25))}
  .sd{flex:none;width:7px;height:7px;border-radius:50%;background:var(--muted);opacity:.55}
  .sd.running{background:var(--vscode-progressBar-background,#0e70c0);opacity:1;animation:pulse 1s ease-in-out infinite}
  .sd.done{background:var(--vscode-testing-iconPassed,#3fb950);opacity:1}
  .sd.error{background:var(--vscode-errorForeground,#f85149);opacity:1}
  .sd.stopped{background:var(--vscode-editorWarning-foreground,#cca700);opacity:1}

  /* ---- history drawer ---- */
  #hist{display:none;position:absolute;left:0;right:0;top:44px;bottom:0;z-index:15;flex-direction:column;background:var(--vscode-sideBar-background);border-top:1px solid var(--line)}
  #hist.on{display:flex}
  #histhd{display:flex;gap:6px;align-items:center;padding:8px 10px 4px}
  #histq{flex:1;min-width:0;background:var(--vscode-input-background);color:var(--vscode-input-foreground);border:1px solid var(--vscode-input-border,var(--line));border-radius:4px;padding:4px 7px;font:inherit}
  #histlist{flex:1;overflow:auto;padding:0 6px 10px}
  .hsec{padding:9px 6px 3px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .hrow{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:4px;cursor:pointer;outline:none}
  .hrow:hover,.hrow:focus{background:var(--vscode-list-hoverBackground)}
  .hrow.on{background:var(--vscode-list-inactiveSelectionBackground,var(--vscode-list-hoverBackground))}
  .hmain{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
  .ht{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hm{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hacts{display:none;gap:2px}
  .hrow:hover .hacts,.hrow:focus .hacts,.hrow:focus-within .hacts{display:flex}
  .hacts button{width:22px;height:22px;border:0;background:transparent;border-radius:4px;padding:0}
  .hacts button:hover{background:var(--vscode-toolbar-hoverBackground,rgba(128,128,128,.25))}
  .pinned{color:var(--vscode-editorWarning-foreground,#cca700)}
  #histempty{padding:16px;color:var(--muted);text-align:center}
  /* sidebar tree: Pinned, then one branch per workspace folder (as Cursor's per-repository list) */
  .hsec{display:flex;align-items:center;gap:6px}
  .hsec span{flex:1}
  .hfold{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:4px;cursor:pointer;outline:none;margin-top:2px}
  .hfold:hover,.hfold:focus{background:var(--vscode-list-hoverBackground)}
  .hfold .car{flex:none;width:10px;font-size:9px;color:var(--muted);text-align:center}
  .hfold .fi{flex:none;width:14px;height:11px;border:1.5px solid var(--muted);border-radius:2px;position:relative;opacity:.8}
  .hfold .fi:before{content:"";position:absolute;left:-1.5px;top:-4px;width:6px;height:3px;border:1.5px solid var(--muted);border-bottom:0;border-radius:2px 2px 0 0}
  .hfold.here .fi{border-color:var(--accent)}.hfold.here .fi:before{border-color:var(--accent)}
  .hfold .fn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hfold.gone .fn{color:var(--muted);text-decoration:line-through}
  .hfold .fc{flex:none;font-size:11px;color:var(--muted)}
  .hfold .hacts{display:none}
  .hfold:hover .hacts,.hfold:focus .hacts{display:flex}
  .branch{margin-left:11px;padding-left:5px;border-left:1px solid var(--line)}
  .branch .branch{margin-left:9px}
  .hrow.tree{padding:3px 6px;gap:7px}
  .hrow.tree .ht{flex:1;min-width:0}
  .hage{flex:none;font-size:11px;color:var(--muted)}
  .hrow:hover .hage,.hrow:focus .hage,.hrow:focus-within .hage{display:none}
  .hsub{flex:none;max-width:40%;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hrow:hover .hsub{display:none}
  .hgrp{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:4px;cursor:pointer;outline:none;color:var(--muted)}
  .hgrp:hover,.hgrp:focus{background:var(--vscode-list-hoverBackground);color:var(--vscode-foreground)}
  .hgrp .car{flex:none;width:10px;font-size:9px;text-align:center}
  .hgrp .ht{flex:1;min-width:0}
  .hmore{padding:3px 6px;font-size:12px;color:var(--muted);cursor:pointer;border-radius:4px;outline:none}
  .hmore:hover,.hmore:focus{color:var(--vscode-foreground);background:var(--vscode-list-hoverBackground)}
  .hnone{padding:3px 6px;font-size:12px;color:var(--muted)}
  .hstart{cursor:pointer;border-radius:4px;outline:none}
  .hstart:hover,.hstart:focus{color:var(--vscode-textLink-foreground);background:var(--vscode-list-hoverBackground)}

  /* ---- problem banner ---- */
  #banner{display:none;margin:8px 10px 0;padding:8px 10px;border:1px solid var(--vscode-inputValidation-errorBorder,#be1100);background:var(--vscode-inputValidation-errorBackground,rgba(190,17,0,.15));border-radius:var(--radius);font-size:12px;line-height:1.45}
  #banner.on{display:block}
  #banner .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

  /* ---- menu ---- */
  #menu{display:none;position:absolute;right:8px;top:44px;z-index:20;min-width:230px;max-width:calc(100% - 16px);padding:4px;background:var(--vscode-menu-background,var(--vscode-editorWidget-background));color:var(--vscode-menu-foreground,inherit);border:1px solid var(--vscode-menu-border,var(--line));border-radius:var(--radius);box-shadow:0 4px 14px rgba(0,0,0,.35)}
  #menu.on{display:block}
  #menu .sec{padding:6px 8px 2px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  #menu button{display:flex;width:100%;gap:8px;align-items:baseline;text-align:left;background:transparent;border:0;border-radius:4px;padding:5px 8px}
  #menu button:hover,#menu button:focus{background:var(--vscode-menu-selectionBackground,var(--vscode-list-hoverBackground));color:var(--vscode-menu-selectionForeground,inherit);outline:none}
  #menu button span{flex:1}
  #menu button small{color:var(--muted);font-size:11px}
  #menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
  /* right-click menu on a file named in the chat */
  #ctx{display:none;position:fixed;z-index:30;min-width:200px;max-width:calc(100% - 8px);padding:4px;background:var(--vscode-menu-background,var(--vscode-editorWidget-background));color:var(--vscode-menu-foreground,inherit);border:1px solid var(--vscode-menu-border,var(--line));border-radius:var(--radius);box-shadow:0 4px 14px rgba(0,0,0,.35)}
  #ctx.on{display:block}
  #ctx .sec{padding:4px 8px 3px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--vscode-editor-font-family)}
  #ctx button{display:flex;width:100%;gap:8px;align-items:baseline;text-align:left;background:transparent;border:0;border-radius:4px;padding:4px 8px}
  #ctx button:hover,#ctx button:focus{background:var(--vscode-menu-selectionBackground,var(--vscode-list-hoverBackground));color:var(--vscode-menu-selectionForeground,inherit);outline:none}
  #ctx button span{flex:1}
  #ctx button small{color:var(--muted);font-size:11px}
  #ctx hr{border:0;border-top:1px solid var(--line);margin:4px 0}

  /* ---- find bar ---- */
  #find{display:none;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line)}
  #find.on{display:flex}
  #findq{flex:1;min-width:0;background:var(--vscode-input-background);color:var(--vscode-input-foreground);border:1px solid var(--vscode-input-border,var(--line));border-radius:4px;padding:3px 6px;font:inherit}
  #findn{font-size:11px;color:var(--muted);white-space:nowrap}

  /* ---- log ---- */
  #log{flex:1;overflow:auto;padding:10px}
  .row{margin:0 0 12px}
  .who{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
  .body{white-space:pre-wrap;word-break:break-word;line-height:1.5}
  .user .body{background:var(--vscode-input-background);border:1px solid var(--vscode-input-border,var(--line));border-radius:var(--radius);padding:7px 9px}
  .assistant .body{border-left:2px solid var(--accent);padding-left:9px}
  .thought{margin-bottom:6px}
  .thought .body{color:var(--muted)}
  .sys{margin-bottom:6px}
  .sys .body{color:var(--muted);font-size:11px}
  .err .body{color:var(--vscode-errorForeground);border:1px solid var(--vscode-inputValidation-errorBorder,#be1100);border-radius:var(--radius);padding:7px 9px}
  .hide{display:none!important}
  mark{background:var(--vscode-editor-findMatchHighlightBackground,rgba(234,92,0,.33));color:inherit}
  details.tool{margin:0 0 4px;font-size:12px;border:1px solid transparent;border-radius:4px}
  details.tool[open]{border-color:var(--line);margin-bottom:8px}
  details.tool summary{display:flex;gap:6px;align-items:baseline;cursor:pointer;list-style:none;padding:2px 6px;border-radius:4px}
  details.tool summary:hover{background:var(--vscode-list-hoverBackground)}
  details.tool summary::-webkit-details-marker{display:none}
  .tool .st{flex:none;width:1em;color:var(--vscode-testing-iconPassed,#3fb950)}
  .tool.bad .st{color:var(--vscode-errorForeground)}
  .tool .nm{flex:none;font-weight:600}
  .tool .lb{flex:1;min-width:0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--vscode-editor-font-family)}
  pre{background:var(--vscode-textCodeBlock-background);padding:7px;border-radius:4px;overflow:auto;max-height:22em;white-space:pre;margin:5px 0;font-family:var(--vscode-editor-font-family);font-size:12px;position:relative}
  details.tool pre{margin:4px 6px 6px}
  code{font-family:var(--vscode-editor-font-family);background:var(--vscode-textCodeBlock-background);padding:0 3px;border-radius:3px}
  .codewrap{position:relative}
  .copy{position:absolute;top:4px;right:4px;font-size:10px;padding:1px 6px;border-radius:3px;border:1px solid var(--line);background:var(--vscode-sideBar-background);opacity:0}
  .codewrap:hover .copy{opacity:1}
  .body h4{margin:8px 0 2px;font-size:1em}
  .li{display:block;padding-left:1.1em;text-indent:-1.1em}

  /* ---- changed files card ---- */
  .changes{margin:0 0 12px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);font-size:12px}
  .changes .hd{display:flex;align-items:center;gap:6px;margin-bottom:4px}
  .changes .hd span{flex:1;font-weight:600}
  .changes a{display:flex;gap:6px;color:var(--link);cursor:pointer;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:1px 0}
  .changes a:hover{text-decoration:underline}
  /* canvas card: a canvas the turn made or changed, as in Cursor */
  .canvascard{display:flex;align-items:center;gap:10px;margin:0 0 12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--vscode-editorWidget-background,transparent)}
  .canvascard:hover,.canvascard:focus{border-color:var(--accent);outline:none}
  .canvascard .ci{flex:none;width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:var(--vscode-badge-background,rgba(128,128,128,.2));font-size:15px}
  .canvascard .ct{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
  .canvascard .ct b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .canvascard .ct small{color:var(--muted);font-size:11px}
  .canvascard button{flex:none}
  .changes .add{color:var(--vscode-gitDecoration-addedResourceForeground,#3a3)}
  .changes .del{color:var(--vscode-gitDecoration-deletedResourceForeground,#c33)}
  .k{color:var(--muted)}

  /* ---- welcome ---- */
  #welcome{padding:6px 2px}
  #welcome h2{margin:4px 0 2px;font-size:1.15em}
  #welcome p{margin:0 0 10px;color:var(--muted);line-height:1.45}
  .card{border:1px solid var(--line);border-radius:var(--radius);padding:9px 10px;margin:0 0 8px}
  .card h3{margin:0 0 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .steps{display:flex;flex-direction:column;gap:5px}
  .step{display:flex;gap:8px;align-items:center}
  .step span{flex:1;min-width:0}
  .step small{display:block;color:var(--muted)}
  .try{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:4px;padding:4px 6px;color:var(--link)}
  .try:hover{background:var(--vscode-list-hoverBackground)}
  kbd{font-family:var(--vscode-editor-font-family);font-size:11px;border:1px solid var(--line);border-radius:3px;padding:0 4px}

  /* ---- plan ---- */
  #todos{display:none;margin:0 10px 6px;padding:7px 9px;border:1px solid var(--line);border-radius:var(--radius);font-size:12px;max-height:11em;overflow:auto}
  #todos.on{display:block}
  #todos .t{display:flex;gap:6px;line-height:1.55}
  #todos .t.completed{color:var(--muted);text-decoration:line-through}
  #todos .t.in_progress{font-weight:600}

  /* ---- composer ---- */
  #live{font-size:11px;color:var(--muted);padding:0 10px 4px;min-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #down{display:none;position:absolute;right:14px;bottom:150px;z-index:5;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--vscode-editorWidget-background,var(--vscode-sideBar-background))}
  #down.on{display:block}
  form{display:flex;flex-direction:column;gap:6px;padding:8px 10px 10px;border-top:1px solid var(--line)}
  textarea{min-height:64px;max-height:40vh;resize:vertical;background:var(--vscode-input-background);color:var(--vscode-input-foreground);border:1px solid var(--vscode-input-border,var(--line));border-radius:var(--radius);padding:7px 8px;font:inherit;line-height:1.45}
  textarea:focus{outline:1px solid var(--accent);outline-offset:-1px}
  .bar{display:flex;gap:6px;align-items:center}
  #chips{flex:1;min-width:0;display:flex;gap:4px;overflow:hidden}
  .chip{flex:none;font-size:11px;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:10px;padding:1px 8px;white-space:nowrap}
  .chip:hover{color:var(--vscode-foreground);border-color:var(--accent)}
  .btn{background:var(--vscode-button-background);color:var(--vscode-button-foreground);border:0;border-radius:4px;padding:5px 14px}
  .btn:hover{background:var(--vscode-button-hoverBackground)}
  .btn2{background:var(--vscode-button-secondaryBackground);color:var(--vscode-button-secondaryForeground);border:0;border-radius:4px;padding:3px 9px;font-size:12px}
  .btn2:hover{background:var(--vscode-button-secondaryHoverBackground)}
  .btn2:disabled{opacity:.5;cursor:default}
  #stop{display:none;background:var(--vscode-errorForeground,#c33);color:#fff}
  .busy #stop{display:inline-block}.busy #go{display:none}
  /* steering: while a chat works, a typed message steers it, queues, or stops and sends */
  #steer,#queue,#now{display:none}
  .busy.typed #steer,.busy.typed #queue,.busy.typed #now{display:inline-block}
  #pend{display:none;margin:0 10px 6px;padding:5px 8px;border:1px dashed var(--line);border-radius:var(--radius);font-size:12px;max-height:9em;overflow:auto}
  #pend.on{display:block}
  #pend .p{display:flex;gap:6px;align-items:center;line-height:1.7}
  #pend .pm{flex:none;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:0 6px}
  #pend .pt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #pend button{flex:none;background:transparent;border:0;color:var(--vscode-textLink-foreground);font-size:11px;padding:0 3px}
  #pend button:hover{text-decoration:underline}
  .row.user.steered{border-left:2px solid var(--accent);padding-left:8px}
  .row.user.steered .who::after{content:" · steered while working";font-weight:normal;color:var(--muted)}
  #hint{font-size:11px;color:var(--muted)}

  /* ---- panels: what an empty chat shows (as Cursor's side panel) ---- */
  #welcome{padding:10px 4px}
  #welcome .psec{font-size:12px;color:var(--muted);margin:14px 0 4px 6px}
  #welcome .psec:first-child{margin-top:4px}
  #welcome .pi{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;border:0;border-radius:4px;padding:4px 6px;color:var(--vscode-foreground);font-size:13px}
  #welcome .pi:hover,#welcome .pi:focus{background:var(--vscode-list-hoverBackground);outline:none}
  #welcome .pic{flex:none;width:16px;text-align:center;color:var(--muted)}
  #welcome .pl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #welcome .pi small{flex:none;color:var(--muted);font-size:11px}
  #welcome .ptip{margin:18px 6px 0;font-size:11px;color:var(--muted);line-height:1.5}

  /* ---- attachments, the + / @ menu, drops ---- */
  #att{display:none;flex-wrap:wrap;gap:4px}
  #att.on{display:flex}
  #att .a{display:flex;align-items:center;gap:4px;max-width:100%;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:1px 2px 1px 6px}
  #att .a span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22em}
  #att .a button{background:transparent;border:0;color:inherit;padding:0 4px;opacity:.7}
  #att .a button:hover{opacity:1}
  #plus{flex:none}
  .chip.mode{border-color:var(--accent);color:var(--vscode-foreground)}
  #pick{display:none;border:1px solid var(--line);border-radius:var(--radius);background:var(--vscode-editorWidget-background,var(--vscode-sideBar-background));max-height:50vh;overflow:auto;font-size:13px}
  #pick.on{display:block}
  #pickq{width:100%;box-sizing:border-box;background:transparent;color:var(--vscode-input-foreground);border:0;border-bottom:1px solid var(--line);padding:6px 8px;font:inherit}
  #pickq:focus{outline:none}
  #picklist .pg{font-size:11px;color:var(--muted);padding:6px 8px 2px}
  #picklist button{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;background:transparent;border:0;padding:4px 8px;color:var(--vscode-foreground)}
  #picklist button b{font-weight:600;flex:none}
  #picklist button small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #picklist button.sel{background:var(--vscode-list-activeSelectionBackground,var(--vscode-list-hoverBackground));color:var(--vscode-list-activeSelectionForeground,inherit)}
  #drop{display:none;position:fixed;inset:4px;z-index:20;align-items:center;justify-content:center;text-align:center;padding:20px;background:var(--vscode-sideBar-background);opacity:.92;border:2px dashed var(--accent);border-radius:6px;font-size:13px;pointer-events:none}
  #drop.on{display:flex}

  /* ==== 2.17 look: closer to Claude Code and Cursor ==== */
  :root{--radius:8px;--soft:var(--vscode-input-background,rgba(128,128,128,.12));--rail:var(--vscode-widget-border,rgba(128,128,128,.28))}
  /* top bar: slim, model as a quiet button */
  #top{padding:6px 8px;gap:4px}
  #backend{background:transparent;border:1px solid transparent;padding:3px 6px;border-radius:6px}
  #backend:hover{background:var(--vscode-toolbar-hoverBackground,rgba(128,128,128,.18));border-color:transparent}
  #bkname{font-weight:600;font-size:12px}
  #bkdetail{font-size:10.5px}
  .icon{width:26px;height:26px;font-size:14px;border-radius:6px}
  #tabs{padding:4px 8px;gap:2px;border-bottom:1px solid var(--line)}
  .tab{border:0;border-radius:6px;padding:3px 4px 3px 8px;font-size:11.5px}
  .tab.on{background:var(--vscode-toolbar-hoverBackground,rgba(128,128,128,.18));border:0}
  .tab:hover{background:var(--vscode-toolbar-hoverBackground,rgba(128,128,128,.12))}

  /* log: no speaker labels; user in a soft bubble, agent as plain prose */
  #log{padding:14px 14px 8px}
  .row{margin:0 0 14px}
  .row.user .who,.row.assistant .who{display:none}
  .user .body{background:var(--soft);border:1px solid var(--rail);border-radius:10px;padding:8px 11px}
  .row.user + .row,.row.user + details.tool{margin-top:2px}
  .assistant .body{border-left:0;padding-left:0;line-height:1.6}
  .thought{margin:0 0 8px}
  .thought .body{color:var(--muted);line-height:1.55}
  .sys{margin:0 0 8px}
  .sys .body{color:var(--muted);font-size:11px;padding-left:2px}
  .err .who{color:var(--vscode-errorForeground)}
  .err .body{border-radius:8px}
  .row.user.steered{border-left:0;padding-left:0}
  .row.user.steered .body{border-color:var(--accent)}
  .row.user.steered .who{display:block}
  .row.user.steered .who::after{content:"steered while working"}
  .row.user.steered .who{font-size:0}
  .row.user.steered .who::after{font-size:10.5px;text-transform:none;letter-spacing:0;color:var(--muted)}

  /* tool calls: compact lines on a thin rail, a status dot, expandable output */
  details.tool{margin:0;padding:0 0 0 10px;border:0;border-left:1px solid var(--rail);border-radius:0;font-size:12px}
  details.tool + :not(details.tool){margin-top:10px}
  :not(details.tool) + details.tool{margin-top:2px}
  details.tool[open]{border-color:var(--rail);margin-bottom:0}
  details.tool summary{gap:7px;align-items:center;padding:3px 6px;border-radius:5px}
  .tool .st{width:7px;height:7px;border-radius:50%;background:var(--vscode-testing-iconPassed,#3fb950);font-size:0;flex:none}
  .tool.bad .st{background:var(--vscode-errorForeground,#f14c4c)}
  .tool .nm{font-weight:600;color:var(--vscode-foreground)}
  .tool .lb{font-size:11.5px}
  details.tool pre{margin:2px 6px 8px;max-height:16em;font-size:11.5px;border:1px solid var(--rail);background:var(--vscode-textCodeBlock-background,rgba(128,128,128,.1))}
  pre{border-radius:6px}

  /* cards */
  .changes,.canvascard{border-radius:10px;border-color:var(--rail)}
  .changes{padding:8px 12px}

  /* plan + live line */
  #todos{margin:0 12px 6px;border-radius:10px;border-color:var(--rail);padding:8px 11px}
  #live{padding:0 14px 4px}

  /* composer: one rounded box with the field, chips and a round send button */
  form#f{position:relative;margin:4px 10px 10px;padding:8px 8px 6px;gap:4px;border:1px solid var(--rail);border-top:1px solid var(--rail);border-radius:12px;background:var(--soft)}
  form#f:focus-within{border-color:var(--accent)}
  form#f textarea{min-height:44px;resize:none;background:transparent;border:0;padding:2px 4px;line-height:1.5}
  form#f textarea:focus{outline:none}
  form#f .bar{gap:4px}
  .chip{border-radius:6px;border-color:transparent;background:var(--vscode-toolbar-hoverBackground,rgba(128,128,128,.14));padding:2px 8px}
  .chip:hover{border-color:transparent;background:var(--vscode-toolbar-hoverBackground,rgba(128,128,128,.25))}
  .chip.mode{border:1px solid var(--accent)}
  #plus{width:24px;height:24px;border-radius:6px}
  #go,#stop{width:26px;height:26px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:14px;line-height:1}
  #stop{display:none;font-size:10px}
  .busy #stop{display:inline-flex}
  .busy #go{display:none}
  #steer,#queue,#now{border-radius:6px;padding:3px 9px}
  #hint{padding:0 4px}
  #hint:empty{display:none}
  #pick{position:absolute;left:0;right:0;bottom:calc(100% + 6px);z-index:12;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
  #att .a{border-radius:6px;background:var(--vscode-toolbar-hoverBackground,rgba(128,128,128,.14));border-color:transparent}
  #down{bottom:130px;right:16px}
</style>
</head>
<body>
<div id="wrap">
  <div id="top">
    <button class="icon" id="histbtn" type="button" title="Chats: pinned, this workspace and every other workspace folder (Ctrl+H)" aria-expanded="false">☰</button>
    <button id="backend" type="button" title="Change backend and model">
      <span id="dot"></span>
      <span id="bk"><span id="bkname">Connecting…</span><span id="bkdetail">looking for a model backend</span></span>
      <span class="chev">▾</span>
    </button>
    <button class="icon" id="new" type="button" title="New chat (running chats keep going)">＋</button>
    <button class="icon" id="more" type="button" title="Menu: settings, import, find, undo" aria-haspopup="true" aria-expanded="false">⋯</button>
  </div>
  <div id="menu" role="menu">
    <div class="sec">Account</div>
    <button data-cmd="signin" id="m-signin"><span>Sign in with Claude…</span><small>opens browser</small></button>
    <button data-cmd="signout" id="m-signout" class="hide"><span>Sign out</span><small id="m-who"></small></button>

    <button data-cmd="effort"><span>Reasoning effort…</span><small id="m-effort"></small></button>
    <button data-cmd="limits"><span>Output limits for this chat…</span><small id="m-limits">standard</small></button>
    <button data-cmd="compress"><span>Compress chat history</span><small>/compress</small></button>
    <button data-cmd="steer"><span>Steer a running chat…</span><small>any window</small></button>
    <button data-cmd="key"><span>Claude API key…</span></button>
    <div class="sec">Safety</div>
    <button data-cmd="perms"><span>Permissions &amp; shell…</span><small id="m-shell"></small></button>

    <div class="sec">Chat</div>

    <div class="sec">Skills</div>

  <div id="banner"><div id="bannertext"></div><div class="acts">
    <button class="btn2" data-cmd="signin">Sign in with Claude</button>

  </div></div>
  <div id="ctx" role="menu" aria-label="File"></div>
  <div id="tabs"></div>
  <div id="hist" role="dialog" aria-label="Chat history">
    <div id="histhd"><input id="histq" type="text" placeholder="Search chats (titles, models, messages)…"/><button class="btn2" type="button" data-cmd="new">＋ New</button><button class="icon" id="histx" type="button" title="Close">✕</button></div>
    <div id="histlist"></div>
  </div>
  <div id="find"><input id="findq" type="text" placeholder="Find in this chat…"/><span id="findn"></span><button class="icon" id="findx" type="button" title="Close">✕</button></div>

  <form id="f">
    <div id="pick" role="dialog" aria-label="Add context, attach, change mode"><input id="pickq" type="text" placeholder="Search modes, context, chats, skills…"/><div id="picklist" role="listbox"></div></div>

      <button class="icon" id="plus" type="button" title="Add context, attach files, change mode (type @)">＋</button>

      <button id="steer" class="btn" type="button" title="Take this into the running turn at its next step; the task goes on">Steer</button>

<script>
/*@file-ref*/
/*@composer*/
const vs = acquireVsCodeApi();
const $ = (id) => document.getElementById(id);
const log = $("log"), q = $("q"), live = $("live"), menu = $("menu");
let info = {}, headerOk = null;
/* the chat on screen, every chat in this workspace, and the last full-text search result */
let sid = "", sessions = [], found = null, searchTimer = 0;

function esc(s){ return String(s).replace(/[&<>]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function md(s){
  const blocks = [];
  let t = esc(s).replace(/```[\w.+-]*\n?([\s\S]*?)```/g, (_, c) => { blocks.push(c); return "\u0000" + (blocks.length - 1) + "\u0000"; });
  t = t.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  t = t.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  t = t.replace(/^#{1,4} +(.+)$/gm, "<h4>$1</h4>");
  t = t.replace(/^\s*[-*] +(.+)$/gm, '<span class="li">• $1</span>');
  t = t.replace(/^\s*(\d+)\. +(.+)$/gm, '<span class="li">$1. $2</span>');
  t = t.replace(/(<\/span>|<\/h4>)\n/g, "$1"); // block elements already break the line
  return t.replace(/\n?\u0000(\d+)\u0000\n?/g, (_, i) => '<div class="codewrap"><button class="copy" type="button">Copy</button><pre>' + blocks[+i] + "</pre></div>");
}
function base(p){ const parts = String(p).split(/[\\/]/); return parts[parts.length - 1]; }
function atBottom(){ return log.scrollHeight - log.scrollTop - log.clientHeight < 60; }
function stick(was){ if (was) log.scrollTop = log.scrollHeight; $("down").classList.toggle("on", !atBottom()); }
function cmd(id){ vs.postMessage({ type: "cmd", id }); }
/* actions the panel handles itself, else the extension's command() */
function act(id){
  if (id === "find") openFind(true);
  else if (id === "new"){ openHistory(false); vs.postMessage({ type: "new" }); }
  else if (id === "history") openHistory(!$("hist").classList.contains("on"));
  else if (id === "multi") vs.postMessage({ type: "multi", text: q.value });
  else if (id === "rename") vs.postMessage({ type: "rename", id: sid });
  else cmd(id);
}

/* ---- chats: tabs and history ---- */
function modelLabel(e){
  if (e.provider === "claude-code") return "Claude Code" + (e.model ? " · " + e.model : "");
  return e.model || (e.provider && e.provider !== "auto" ? e.provider : "auto");
}
function ago(ts){
  const s = (Date.now() - ts) / 1000;
  if (s < 60) return "now"; if (s < 3600) return Math.floor(s / 60) + "m"; if (s < 86400) return Math.floor(s / 3600) + "h";
  const d = Math.floor(s / 86400); return d < 7 ? d + "d" : new Date(ts).toLocaleDateString();
}
function dayGroup(e){
  if (e.pinned) return "Pinned";
  const d = new Date(); d.setHours(0, 0, 0, 0); const t = d.getTime();
  return e.updated >= t ? "Today" : e.updated >= t - 864e5 ? "Yesterday" : e.updated >= t - 6 * 864e5 ? "Previous 7 days" : "Older";
}
function dot(st){ const s = document.createElement("span"); s.className = "sd " + (st || "idle"); s.title = st || "idle"; return s; }
function paintTabs(){
  const box = $("tabs");
  box.innerHTML = "";
  const open = sessions.filter((e) => e.open || e.id === sid || e.status === "running").sort((a, b) => (a.created || 0) - (b.created || 0));
  if (open.length < 2) return; // one chat needs no tab strip
  for (const e of open){
    const b = document.createElement("button");
    b.type = "button";
    b.className = "tab" + (e.id === sid ? " on" : "") + (e.unread ? " unread" : "");
    b.title = e.title + "\n" + modelLabel(e) + " · " + (e.status || "idle") + "\nMiddle-click or × closes the tab; the chat stays in history.";
    b.appendChild(dot(e.status));
    const t = document.createElement("span"); t.className = "tt"; t.textContent = e.title; b.appendChild(t);
    const x = document.createElement("span"); x.className = "x"; x.textContent = "×"; x.title = "Close tab (keeps the chat in history)";
    x.onclick = (ev) => { ev.stopPropagation(); vs.postMessage({ type: "close", id: e.id }); };
    b.appendChild(x);
    b.onclick = () => { if (e.id !== sid) vs.postMessage({ type: "switch", id: e.id }); };
    b.onauxclick = (ev) => { if (ev.button === 1) vs.postMessage({ type: "close", id: e.id }); };
    box.appendChild(b);
    if (e.id === sid) setTimeout(() => b.scrollIntoView({ block: "nearest", inline: "nearest" }), 0);
  }
}
function histButton(text, title, fn, cls){
  const b = document.createElement("button"); b.type = "button"; b.textContent = text; b.title = title; if (cls) b.className = cls;
  b.onclick = (ev) => { ev.stopPropagation(); fn(); };
  return b;
}
/* Cursor-style ages: now, 5m, 3h, 2d, 3w, 2mo, 1y */
function age(ts){
  const s = Math.max(0, (Date.now() - ts) / 1000);
  if (s < 60) return "now"; if (s < 3600) return Math.floor(s / 60) + "m"; if (s < 86400) return Math.floor(s / 3600) + "h";
  const d = s / 86400; if (d < 7) return Math.floor(d) + "d"; if (d < 30) return Math.floor(d / 7) + "w"; if (d < 365) return Math.floor(d / 30) + "mo"; return Math.floor(d / 365) + "y";
}
/* the tree: every workspace folder with chats ("tree" message), folded state kept across reloads */
let tree = [];
const ui = Object.assign({ open: {}, shut: {}, more: {}, grp: {} }, (vs.getState() || {}).tree || {});
function keepUi(){ vs.setState(Object.assign({}, vs.getState() || {}, { tree: ui })); }
const SHOW = 5; // chats per folder before "More"
function el(tag, cls, text){ const d = document.createElement(tag); if (cls) d.className = cls; if (text != null) d.textContent = text; return d; }
function chatRow(e, w, opts = {}){
  const here = !!w.here;
  const r = el("div", "hrow tree" + (here && e.id === sid ? " on" : "") + (e.unread ? " unread" : ""));
  r.tabIndex = 0;
  r.title = e.title + "\n" + modelLabel(e) + " · " + (e.turns ? e.turns + " turn" + (e.turns === 1 ? "" : "s") : "empty") + " · " + (e.status || "idle") + (here ? "" : "\nIn " + (w.workspace || w.name) + ": click to open that folder, continue the chat here, or read it.");
  r.appendChild(dot(e.status));
  if (e.pinned && !opts.inPinned) r.appendChild(el("span", "pinned", "★"));
  r.appendChild(el("span", "ht", e.title));
  if (opts.folder) r.appendChild(el("span", "hsub", w.name));
  r.appendChild(el("span", "hage", age(e.updated || Date.now())));
  const acts = el("div", "hacts");
  if (here){
    acts.appendChild(histButton(e.pinned ? "★" : "☆", e.pinned ? "Unpin" : "Pin to the top", () => vs.postMessage({ type: "pin", id: e.id }), e.pinned ? "pinned" : ""));
    acts.appendChild(histButton("✎", "Rename", () => vs.postMessage({ type: "rename", id: e.id })));
    acts.appendChild(histButton("🗑", "Delete from history", () => vs.postMessage({ type: "delete", id: e.id })));
  } else {
    acts.appendChild(histButton(e.pinned ? "★" : "☆", e.pinned ? "Unpin" : "Pin to the top", () => vs.postMessage({ type: "pinForeign", slug: w.slug, id: e.id }), e.pinned ? "pinned" : ""));
  }
  r.appendChild(acts);
  const open = () => {
    if (!here){ vs.postMessage({ type: "foreign", slug: w.slug, id: e.id }); return; }
    openHistory(false); if (e.id !== sid) vs.postMessage({ type: "switch", id: e.id });
  };
  r.onclick = open;
  r.onkeydown = (ev) => { if (ev.key === "Enter") open(); else if (ev.key === "Delete" && here) vs.postMessage({ type: "delete", id: e.id }); };
  return r;
}
/* top-level nodes of one folder: single chats, and multi-model runs (same group) as a sub-branch */
function nodesOf(chats){
  const byGroup = new Map();
  for (const e of chats) if (e.group){ if (!byGroup.has(e.group)) byGroup.set(e.group, []); byGroup.get(e.group).push(e); }
  const out = [], done = new Set();
  for (const e of chats){
    const g = e.group && byGroup.get(e.group);
    if (g && g.length > 1){ if (!done.has(e.group)){ done.add(e.group); out.push({ group: e.group, chats: g }); } }
    else out.push({ chat: e });
  }
  return out;
}
function paintHistory(){
  const list = $("histlist");
  list.innerHTML = "";
  const needle = $("histq").value.trim().toLowerCase();
  const deep = found && found.q.toLowerCase() === needle ? new Set(found.ids) : null;
  // This window's folder is drawn from the live list; the others from the master index.
  let folders = tree.map((w) => (w.here ? Object.assign({}, w, { chats: sessions }) : w));
  if (!folders.some((w) => w.here)) folders.unshift({ slug: "", name: "This workspace", workspace: "", here: true, current: true, exists: true, chats: sessions });
  const hit = (e, w) => !needle || (e.title + " " + modelLabel(e) + " " + w.name).toLowerCase().includes(needle) || (w.here && deep && deep.has(e.id));
  let shown = 0;
  // Pinned: every workspace's pinned chats, newest first
  const pins = [];
  for (const w of folders) for (const e of w.chats || []) if (e.pinned && hit(e, w)) pins.push({ e, w });
  pins.sort((a, b) => (b.e.updated || 0) - (a.e.updated || 0));
  if (pins.length){
    list.appendChild(el("div", "hsec", "Pinned"));
    for (const p of pins){ list.appendChild(chatRow(p.e, p.w, { inPinned: true, folder: !p.w.here })); shown++; }
  }
  const sec = el("div", "hsec"); sec.appendChild(el("span", "", "Workspaces"));
  const exp = histButton("⊟", "Collapse every folder but this one", () => { ui.open = {}; ui.shut = {}; keepUi(); paintHistory(); });
  exp.className = "icon"; exp.style.width = exp.style.height = "20px"; exp.style.fontSize = "12px"; sec.appendChild(exp);
  list.appendChild(sec);
  for (const w of folders){
    const chats = (w.chats || []).filter((e) => !e.pinned && hit(e, w));
    if (needle && !chats.length && !w.name.toLowerCase().includes(needle)) continue;
    const key = w.slug || "_here";
    const isOpen = needle ? true : w.here || w.current ? !ui.shut[key] : !!ui.open[key];
    const f = el("div", "hfold" + (w.here ? " here" : "") + (w.exists === false ? " gone" : ""));
    f.tabIndex = 0;
    f.title = (w.workspace || w.name) + (w.here ? "\nThis window's folder" : w.exists === false ? "\nThe folder no longer exists" : "\nAnother workspace folder: its chats open there");
    f.setAttribute("aria-expanded", String(isOpen));
    f.appendChild(el("span", "car", isOpen ? "▾" : "▸"));
    f.appendChild(el("span", "fi"));
    f.appendChild(el("span", "fn", w.name));
    const run = (w.chats || []).filter((e) => e.status === "running").length;
    if (run) f.appendChild(dot("running"));
    f.appendChild(el("span", "fc", String((w.chats || []).length || "")));
    const startHere = () => { if (w.here) openHistory(false); vs.postMessage({ type: "newIn", path: w.workspace || "", here: !!w.here }); };
    if (w.here || (w.workspace && w.exists !== false)){
      const a = el("div", "hacts");
      a.appendChild(histButton("＋", w.here ? "New chat in this folder" : "Start a new chat in this folder (opens it)", startHere));
      if (!w.here) a.appendChild(histButton("↗", "Open this folder in a new window", () => vs.postMessage({ type: "openFolder", path: w.workspace })));
      f.appendChild(a);
    }

    list.appendChild(f);

    }

    for (const n of all ? nodes : nodes.slice(0, SHOW)){

      g.appendChild(el("span", "hage", age(Math.max(...n.chats.map((e) => e.updated || 0)))));
      const gt = () => { if (gOpen) ui.grp[gk] = 1; else delete ui.grp[gk]; keepUi(); paintHistory(); };
      g.onclick = gt; g.onkeydown = (ev) => { if (ev.key === "Enter") gt(); };

/** The text line under the pointer and the pointer's offset in it. */
function caretLine(x, y){
  let node = null, off = 0;
  if (document.caretRangeFromPoint){ const r = document.caretRangeFromPoint(x, y); if (r){ node = r.startContainer; off = r.startOffset; } }
  else if (document.caretPositionFromPoint){ const p = document.caretPositionFromPoint(x, y); if (p){ node = p.offsetNode; off = p.offset; } }
  if (!node || node.nodeType !== 3) return null;
  const t = node.textContent, a = t.lastIndexOf("\n", off - 1) + 1, b = t.indexOf("\n", off);
  return { text: t.slice(a, b < 0 ? t.length : b), off: off - a };
}
/** The file at the pointer: a changed-file row, a tool row, a selected or `code` path, or a path in the text / a tool's output line. */
function refAt(e, useSel){
  if (!window.FileRef || !e.target.closest) return null;
  const tagged = e.target.closest("[data-path]");
  if (tagged) return Object.assign({ line: 0, col: 0 }, FileRef.whole(tagged.dataset.path) || { path: tagged.dataset.path }, { cp: tagged.dataset.cp || "" });
  if (!e.target.closest("#log, #todos")) return null;
  const s = window.getSelection();
  const sel = s ? String(s).trim() : "";
  if (useSel && sel && sel.length < 400 && s.containsNode(e.target, true)){ const r = FileRef.whole(sel); if (r) return r; }
  const code = e.target.closest("code");
  if (code){ const r = FileRef.whole(code.textContent); if (r) return r; }
  const c = caretLine(e.clientX, e.clientY);
  return c ? FileRef.find(c.text, c.off) : null;
}

// Up/Down walk the tree (folders, run groups, chats, More)
$("histlist").addEventListener("keydown", (e) => {
  if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
  const all = [...$("histlist").querySelectorAll("[tabindex]")];
  const i = all.indexOf(document.activeElement);
  if (i < 0) return;
  e.preventDefault();
  const n = all[i + (e.key === "ArrowDown" ? 1 : -1)];
  if (n) n.focus(); else if (e.key === "ArrowUp") $("histq").focus();
});
$("findq").addEventListener("input", applyFind);
$("findx").onclick = () => openFind(false);
$("down").onclick = () => { log.scrollTop = log.scrollHeight; $("down").classList.remove("on"); };
log.addEventListener("scroll", () => $("down").classList.toggle("on", !atBottom()));
const working = () => document.body.classList.contains("busy");
const steerMode = () => (info.steerDefault === "queue" ? "queue" : "steer");
/* send while idle; while working: steer (into the running turn), queue (next turn) or now (stop & send) */
function sendAs(mode){
  const raw = q.value.trim(); if (!raw && !att.length) return;
  // A /command goes as typed; anything else carries the mode and the attachments.
  const t = /^\//.test(raw) && !att.length ? raw : Composer.compose(raw, chatMode, att);
  q.value = ""; att = []; paintAtt(); typed();
  if (!working()){ busy(true); vs.postMessage({ type: "send", text: t, sid }); return; }
  vs.postMessage({ type: "send", text: t, sid, mode: mode || steerMode() });
}
function typed(){ document.body.classList.toggle("typed", !!q.value.trim() || att.length > 0); paintHint(); }

/* ---- composer: attachments, mode, the ＋ / @ menu, drop and paste ---- */
let att = [];
let chatMode = (vs.getState() || {}).mode || "agent";
function setMode(k){ chatMode = Composer.MODES[k] ? k : "agent"; vs.setState(Object.assign({}, vs.getState() || {}, { mode: chatMode })); paintInfo(); }
function paintAtt(){
  const box = $("att"); box.innerHTML = "";
  box.classList.toggle("on", att.length > 0);
  att.forEach((a, i) => {
    const c = el("div", "a");
    c.appendChild(el("span", "", (a.path ? (Composer.IMAGE.test(a.path) ? "▣ " : "▤ ") + base(a.path) : "≡ " + a.label)));
    c.title = a.path ? a.path + (Composer.IMAGE.test(a.path) ? "\nImage: sent to models that can see images" : "") : a.label + "\n" + String(a.text || "").slice(0, 400);
    if (a.path) c.dataset.path = a.path;
    const x = el("button", "", "✕"); x.type = "button"; x.title = "Remove";
    x.onclick = () => { att.splice(i, 1); paintAtt(); typed(); };
    c.appendChild(x); box.appendChild(c);
  });
}
function addAtt(items){
  for (const it of items || []){
    const dup = it.path ? att.some((a) => a.path === it.path) : att.some((a) => a.label === it.label && a.text === it.text);
    if (!dup) att.push(it);
  }
  paintAtt(); typed(); q.focus();
}
function attachKind(kind, extra){ vs.postMessage(Object.assign({ type: "attach", kind }, extra || {})); }
let pickSel = 0, pickShown = [], pickAt = -1;
function pickItems(){
  const L = [];
  for (const k of Object.keys(Composer.MODES)) L.push({ g: "Modes", b: Composer.MODES[k].label, s: (chatMode === k ? "✓ " : "") + Composer.MODES[k].hint, fn: () => setMode(k) });
  L.push({ g: "Context", b: "Attach", s: "files or folders from disk…", fn: () => attachKind("pick") });
  L.push({ g: "Context", b: "Files", s: "search the workspace…", fn: () => attachKind("files") });
  L.push({ g: "Context", b: "Active file", s: "or its selection", fn: () => attachKind("active") });
  L.push({ g: "Context", b: "Open tabs", s: "every open file", fn: () => attachKind("tabs") });
  L.push({ g: "Context", b: "Changes", s: "files with uncommitted changes", fn: () => attachKind("changes") });
  L.push({ g: "Context", b: "Problems", s: "errors and warnings", fn: () => attachKind("problems") });
  for (const c of panels.canvases) L.push({ g: "Canvases", b: c.name, s: "attach the canvas source", fn: () => addAtt([{ path: c.file }]) });
  for (const s of sessions.filter((x) => x.id !== sid).slice(0, 20)) L.push({ g: "Chats", b: s.title || "Chat", s: "attach its transcript · " + modelLabel(s), fn: () => attachKind("chat", { id: s.id }) });
  // Custom commands (.cortexide/commands/*.md) put "/name " in the box; agents put "@name ".
  const putIn = (t) => { q.value = t + q.value.replace(/^\s+/, ""); typed(); q.focus(); q.setSelectionRange(t.length, t.length); };
  for (const c of panels.commands || []) L.push({ g: "Commands", b: "/" + c.name, s: (c.hint ? c.hint + " · " : "") + (c.description || ""), fn: () => putIn("/" + c.name + " ") });
  for (const a of panels.agents || []) L.push({ g: "Agents", b: "@" + a.name, s: (a.mode === "subagent" ? "sub-agent · " : "") + (a.description || ""), fn: () => putIn("@" + a.name + " ") });
  L.push({ g: "Tools", b: "Commands", s: "list custom /commands", fn: () => { putIn("/commands"); } });
  L.push({ g: "Tools", b: "Skills", s: "skills & canvases catalog", fn: () => cmd("skills") });
  L.push({ g: "Tools", b: "MCP", s: "MCP servers (settings)", fn: () => cmd("mcp") });
  L.push({ g: "Tools", b: "Compress", s: "summarise this chat (/compress)", fn: () => act("compress") });
  L.push({ g: "Tools", b: "Several models", s: "run this prompt on several models", fn: () => act("multi") });
  return L;
}
function openPick(on, fromAt){
  $("pick").classList.toggle("on", on);
  $("plus").setAttribute("aria-expanded", String(on));
  if (on){ pickAt = fromAt ? q.selectionStart - 1 : -1; pickSel = 0; $("pickq").value = ""; paintPick(); $("pickq").focus(); }
  else { pickAt = -1; q.focus(); }
}
function paintPick(){
  const n = $("pickq").value.trim().toLowerCase();
  const list = $("picklist"); list.innerHTML = "";
  pickShown = pickItems().filter((i) => !n || (i.b + " " + i.s + " " + i.g).toLowerCase().includes(n));
  pickSel = Math.min(pickSel, Math.max(0, pickShown.length - 1));
  let g = "";
  pickShown.forEach((it, i) => {
    if (it.g !== g){ g = it.g; list.appendChild(el("div", "pg", g)); }
    const b = el("button", i === pickSel ? "sel" : ""); b.type = "button"; b.setAttribute("role", "option");
    b.appendChild(el("b", "", it.b)); b.appendChild(el("small", "", it.s));
    b.onmousedown = (e) => e.preventDefault();
    b.onclick = (e) => { e.stopPropagation(); runPick(i); };
    list.appendChild(b);
  });
  if (!pickShown.length) list.appendChild(el("div", "pg", "Nothing matches"));
}
function runPick(i){
  const it = pickShown[i]; if (!it) return;
  if (pickAt >= 0 && q.value[pickAt] === "@"){ q.value = q.value.slice(0, pickAt) + q.value.slice(pickAt + 1); typed(); }
  openPick(false);
  it.fn();
}
$("pickq").addEventListener("input", () => { pickSel = 0; paintPick(); });
$("pickq").addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp"){
    e.preventDefault();
    if (pickShown.length) pickSel = (pickSel + (e.key === "ArrowDown" ? 1 : pickShown.length - 1)) % pickShown.length;
    paintPick();
    const s = $("picklist").querySelector(".sel"); if (s && s.scrollIntoView) s.scrollIntoView({ block: "nearest" });
  } else if (e.key === "Enter"){ e.preventDefault(); runPick(pickSel); }
  else if (e.key === "Escape"){ e.preventDefault(); e.stopPropagation(); openPick(false); }
});
$("plus").onclick = (e) => { e.stopPropagation(); openPick(!$("pick").classList.contains("on"), false); };
document.addEventListener("click", (e) => { if ($("pick").classList.contains("on") && !$("pick").contains(e.target) && e.target.id !== "plus") openPick(false); });
// @ at the start of a word opens the menu, as in Cursor
q.addEventListener("input", (e) => {
  if (e.data !== "@") return;
  const i = q.selectionStart - 1;
  if (i === 0 || /\s/.test(q.value[i - 1])) openPick(true, true);
});
/* drop: files from VS Code (hold Shift) or the OS; images and other files without a path are saved first */
let dragDepth = 0;
const carriesFiles = (dt) => !!dt && [...(dt.types || [])].some((t) => /^(Files|application\/vnd\.code\.uri-list|text\/uri-list|resourceurls|codeeditors)$/i.test(t));
document.addEventListener("dragenter", (e) => { if (!carriesFiles(e.dataTransfer)) return; e.preventDefault(); dragDepth++; $("drop").classList.add("on"); });
document.addEventListener("dragover", (e) => { if (!carriesFiles(e.dataTransfer)) return; e.preventDefault(); e.dataTransfer.dropEffect = "copy"; });
document.addEventListener("dragleave", () => { if (--dragDepth <= 0){ dragDepth = 0; $("drop").classList.remove("on"); } });
document.addEventListener("drop", (e) => {
  dragDepth = 0; $("drop").classList.remove("on");
  const dt = e.dataTransfer; if (!dt) return;
  const uris = Composer.dropUris((t) => { try { return dt.getData(t) || ""; } catch { return ""; } });
  if (uris.length){ e.preventDefault(); attachKind("uris", { uris }); return; }
  if (dt.files && dt.files.length){ e.preventDefault(); sendFiles(dt.files); }
  // plain text dropped on the input box: the browser inserts it
});
function sendFiles(files){
  for (const f of files){
    if (f.size > 25 * 1024 * 1024){ add({ cls: "err", text: f.name + " is larger than 25 MB: attach it from disk instead (＋ → Attach)." }); continue; }
    const r = new FileReader();
    r.onload = () => attachKind("data", { name: f.name || "pasted." + ((f.type || "").split("/")[1] || "bin"), data: String(r.result) });
    r.readAsDataURL(f);
  }
}
// paste a screenshot (or a copied file) into the input box
q.addEventListener("paste", (e) => {
  const files = [...((e.clipboardData && e.clipboardData.files) || [])];
  if (!files.length) return;
  e.preventDefault(); sendFiles(files);
});
function paintHint(){
  const h = $("hint");
  if (!working()){ h.innerHTML = "<kbd>Enter</kbd> send · <kbd>Shift+Enter</kbd> new line · edits save to disk, each turn can be undone"; return; }
  const def = steerMode(), other = def === "queue" ? "steer" : "queue";
  h.innerHTML = "Working — you can still type. <kbd>Enter</kbd> " + def + " · <kbd>Alt+Enter</kbd> " + other + " · <kbd>Ctrl+Shift+Enter</kbd> stop &amp; send";
}
let pend = [];
function paintPend(){
  const box = $("pend"); box.innerHTML = "";
  box.classList.toggle("on", pend.length > 0);
  const LABEL = { steer: "next step", queue: "queued", now: "stop & send" };
  for (const p of pend){
    const r = el("div", "p");
    r.appendChild(el("span", "pm", p.command && p.mode === "queue" ? "after this turn" : LABEL[p.mode] || p.mode));
    const t = el("span", "pt", p.text); t.title = p.text + (p.from ? "\n(from " + p.from + ")" : ""); r.appendChild(t);
    const b = (label, title, fn) => { const x = el("button", "", label); x.type = "button"; x.title = title; x.onclick = fn; r.appendChild(x); };
    if (p.mode === "queue" && !p.command) b("steer now", "Take it into the running turn at its next step instead", () => vs.postMessage({ type: "requeue", sid, id: p.id, mode: "steer" }));
    if (p.mode !== "now") b("stop & send", "Stop the running turn, then send this", () => vs.postMessage({ type: "requeue", sid, id: p.id, mode: "now" }));
    b("✎", "Take it back into the input box", () => vs.postMessage({ type: "unqueue", sid, id: p.id }));
    box.appendChild(r);
  }
}
$("f").addEventListener("submit", (e) => { e.preventDefault(); sendAs(""); });
q.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || e.shiftKey && !(e.ctrlKey || e.metaKey) || e.isComposing) return;
  e.preventDefault();
  if (working() && (e.ctrlKey || e.metaKey) && e.shiftKey) sendAs("now");
  else if (working() && e.altKey) sendAs(steerMode() === "queue" ? "steer" : "queue");
  else sendAs("");
});
q.addEventListener("input", typed);
$("steer").onclick = () => sendAs("steer");
$("queue").onclick = () => sendAs("queue");
$("now").onclick = () => sendAs("now");
$("stop").onclick = () => vs.postMessage({ type: "stop", sid });

window.addEventListener("message", (e) => {
  const m = e.data || {};
  // Events of a chat that is not on screen: its log is kept by the extension; the tab dot shows its state.
  if (m.sid && m.sid !== sid && m.type !== "restore") return;
  if (m.type === "header") header(m);
  else if (m.type === "info"){ info = m; paintInfo(); paintHint(); }
  else if (m.type === "restore"){ sid = m.sid || ""; log.innerHTML = ""; live.textContent = ""; (m.log || []).forEach(add); todos(m.todos); welcome(); busy(!!m.busy); pend = m.pending || []; paintPend(); log.scrollTop = log.scrollHeight; paintTabs(); }
  else if (m.type === "pending"){ pend = m.items || []; paintPend(); }
  else if (m.type === "panels"){ panels = Object.assign({ tabs: [], canvases: [], custom: [], commands: [], agents: [] }, m); welcome(); }
  else if (m.type === "attached") addAtt(m.items);
  else if (m.type === "steered") add({ cls: "user", text: m.text, steered: true, from: m.from });
  else if (m.type === "unsent"){ const cur = q.value.trim(); q.value = cur ? m.text + "\n\n" + cur : m.text; typed(); q.focus(); }
  else if (m.type === "sessions"){ sessions = m.items || []; if (m.active) sid = m.active; info.running = m.running || 0; paintTabs(); paintInfo(); if ($("hist").classList.contains("on")) paintHistory(); }
  else if (m.type === "found"){ found = { q: m.q, ids: m.ids || [] }; if ($("hist").classList.contains("on")) paintHistory(); }
  else if (m.type === "tree"){ tree = m.items || []; if ($("hist").classList.contains("on")) paintHistory(); }
  else if (m.type === "history") openHistory(!!m.open);
  else if (m.type === "wantMulti") act("multi");
  else if (m.type === "user") add({ cls: "user", text: m.text });
  else if (m.type === "todos") todos(m.todos);
  else if (m.type === "changes") add({ cls: "changes", id: m.id, files: m.files });
  else if (m.type === "canvas") add({ cls: "canvas", file: m.file, name: m.name, kind: m.kind });
  else if (m.type === "undone"){ const card = log.querySelector('.changes[data-id="' + m.id + '"]'); if (card){ card.querySelector("button").disabled = true; const s = card.querySelector(".hd span"); s.textContent = "Reverted · " + s.textContent; } }
  else if (m.type === "busy") busy(true);
  else if (m.type === "idle") busy(false);
  else if (m.type === "status"){ if (m.transient) live.textContent = m.text; else add({ cls: "sys", text: m.text }); }
  else if (m.type === "thought") add({ cls: "thought", text: m.text });
  else if (m.type === "tool"){ if (m.status === "start") live.textContent = "→ " + m.name + " " + (m.label || ""); else add({ cls: "tool", name: m.name, label: m.label, ok: m.ok, text: m.result }); }
  else if (m.type === "assistant") add({ cls: "assistant", text: m.text });
  else if (m.type === "error"){ add({ cls: "err", text: m.text }); busy(false); }
  else if (m.type === "seed"){ q.value = m.text; q.focus(); }
});
welcome();
paintHint();
vs.postMessage({ type: "ready" });
</script>
</body>
</html>
